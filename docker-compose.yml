services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happyrobot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d happyrobot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/happyrobot?sslmode=disable
      REALTIME_DATABASE_URL: postgres://postgres:postgres@db:5432/happyrobot?sslmode=disable
      PORT: 8080
      CORS_ORIGIN: http://localhost:${WEB_HOST_PORT:-3000},http://127.0.0.1:${WEB_HOST_PORT:-3000}
      AUTO_MIGRATE: "true"
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8080}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_HOST_PORT:-8080}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
